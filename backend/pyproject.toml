[project]
name = "secplat"
version = "0.1.0"
description = "Security scanning orchestration platform (ProjectDiscovery tools)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.32",
    "celery[redis]>=5.6.3",
    "sqlalchemy>=2.0.52",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.7",
    "jinja2>=3.1",
    "weasyprint>=66",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "import-linter>=2.1",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secplat"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/secplat/presentation/**" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.importlinter]
root_package = "secplat"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "DDD layers: presentation > infrastructure > application > domain"
type = "layers"
layers = [
    "secplat.presentation",
    "secplat.infrastructure",
    "secplat.application",
    "secplat.domain",
]

[[tool.importlinter.contracts]]
name = "domain stays pure (no framework imports)"
type = "forbidden"
source_modules = ["secplat.domain"]
forbidden_modules = [
    "sqlalchemy",
    "celery",
    "pydantic",
    "fastapi",
    "uvicorn",
    "alembic",
    "redis",
]
