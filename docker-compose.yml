name: secplat

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: secplat
      POSTGRES_USER: secplat
      POSTGRES_PASSWORD: devpass
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secplat -d secplat"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10.1
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: backend
    command: uvicorn secplat.presentation.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ${SECPLAT_LOCAL_PROJECTS_DIR:-./local-projects}:/srv/projects:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: backend
    command: celery -A secplat.infrastructure.queue.app worker -Q scans -c 2 --max-tasks-per-child=50
    env_file: .env
    volumes:
      - nuclei-templates:/opt/nuclei-templates
      - ${SECPLAT_LOCAL_PROJECTS_DIR:-./local-projects}:/srv/projects
      - trivy-cache:/home/scanner/.cache/trivy
      - semgrep-cache:/home/scanner/.semgrep
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: backend
    command: celery -A secplat.infrastructure.queue.app beat --schedule /tmp/celerybeat-schedule
    env_file: .env
    volumes:
      - nuclei-templates:/opt/nuclei-templates
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: frontend
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata: {}
  nuclei-templates: {}
  trivy-cache: {}
  semgrep-cache: {}
